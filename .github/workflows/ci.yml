name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (includes design-system rules)
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unused files and dependencies
        run: npm run knip

      - name: Typecheck and build
        run: npm run build

      - name: Install test browser
        run: npx playwright install chromium --with-deps

      - name: Unit tests
        run: npm test
